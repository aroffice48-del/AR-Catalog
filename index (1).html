<!doctype html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>প্রোডাক্ট রেট তালিকা</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#edf0f4;--sf:#fff;--ink:#0f1b2d;--mute:#5a6a7e;--line:#d8dee7;--am:#e39b0b;--amb:#fff1d0;--ami:#7a4a00;--wa:#178f4a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c121c;--sf:#151e2b;--ink:#eaf0f7;--mute:#9aa9bc;--line:#26334a;--am:#f2b134;--amb:#3a2a08;--ami:#ffd98a;--wa:#3dd27a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c121c;--sf:#151e2b;--ink:#eaf0f7;--mute:#9aa9bc;--line:#26334a;--am:#f2b134;--amb:#3a2a08;--ami:#ffd98a;--wa:#3dd27a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Hind Siliguri","Noto Sans Bengali","Nirmala UI",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--sf);border-bottom:1px solid var(--line);padding:12px 14px 10px}
.wrap{max-width:760px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{margin:0;font-size:20px;font-weight:700;line-height:1.3}
.sub{margin:0 0 8px;color:var(--mute);font-size:13px}
input[type=search]{width:100%;font:inherit;padding:10px 14px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=search]:focus{outline:none;border-color:var(--am)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chip{flex:none;font:inherit;font-size:14px;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--sf);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--am);border-color:var(--am);color:#1b1200;font-weight:600}
main{max-width:760px;margin:0 auto;padding:14px}
main.pad{padding-bottom:110px}
.lead{margin:2px 0 12px;color:var(--mute);font-size:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{font:inherit;text-align:left;display:flex;flex-direction:column;gap:2px;padding:14px 12px;background:var(--sf);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--am);border-radius:6px;cursor:pointer}
.tile .em{font-size:26px;line-height:1.2}.tile b{font-size:16px;line-height:1.3}.tile span{font-size:13px;color:var(--mute)}
.count{margin:0 0 8px;color:var(--mute);font-size:14px}
.row{display:grid;grid-template-columns:56px 1fr;gap:10px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ph{width:56px;height:56px;border-radius:8px;background:var(--amb);display:grid;place-items:center;font-size:26px;overflow:hidden;padding:0;border:0}
button.ph{cursor:zoom-in}.ph img{width:100%;height:100%;object-fit:cover;display:block}
h3{margin:0;font-size:16px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.cat{font-size:13px;color:var(--mute)}
.rates{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.r{padding:2px 9px;border-radius:5px;border:1px solid var(--line);font-size:14px}
.r.main{background:var(--amb);border-color:transparent;color:var(--ami);font-weight:700;font-size:16px}
.act{grid-column:2;display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;padding:5px 12px;border-radius:8px;border:1px solid var(--line);background:var(--sf);color:var(--ink);text-decoration:none;cursor:pointer}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff;font-weight:600}
.btn.warn{border-color:#c0392b;color:#c0392b}
.btn[aria-pressed=true]{background:var(--am);border-color:var(--am);color:#1b1200;font-weight:600}
.btn:focus-visible,.chip:focus-visible,.tile:focus-visible,.ph:focus-visible{outline:3px solid var(--am);outline-offset:2px}
.empty{padding:28px 6px;color:var(--mute);text-align:center}
.back{margin:0 0 6px}
.desc{margin:4px 0 0;font-size:14px;color:var(--mute);white-space:pre-line;overflow-wrap:anywhere}
.badge{display:inline-block;margin-left:8px;padding:0 8px;border-radius:5px;background:#c0392b;color:#fff;font-size:13px;font-weight:600;vertical-align:middle}
.row.out .ph,.row.out .rates{opacity:.55}
.chk{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink)}.chk input{width:20px;height:20px}
textarea{font:inherit;font-size:15px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);min-height:70px;resize:vertical}
.banner{margin:0 0 10px;padding:8px 12px;border-radius:8px;background:var(--amb);color:var(--ami);font-size:14px}
.edit{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{display:flex;flex-direction:column;font-size:13px;color:var(--mute)}.fld.w{grid-column:1/-1}
.fld input,.fld select{font:inherit;font-size:15px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);min-width:0}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--sf);border-top:2px solid var(--am);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#bar span{flex:1;font-size:14px;min-width:150px}
dialog{border:0;padding:0;background:transparent;max-width:94vw}
dialog::backdrop{background:rgba(0,0,0,.72)}
#lbimg{max-width:92vw;max-height:80vh;display:block;border-radius:8px;background:#fff}
</style></head><body>
<header><div class="wrap">
<div class="top"><h1>প্রোডাক্ট রেট তালিকা</h1><button id="ed" class="btn" type="button" aria-pressed="false" hidden>✏️ এডিট মোড</button></div>
<p class="sub">খুচরা রেট: ২৯-০৯-২০২৬ তারিখের তালিকা অনুযায়ী</p>
<input id="q" type="search" placeholder="প্রোডাক্টের নাম লিখে খুঁজুন" aria-label="প্রোডাক্ট খুঁজুন" autocomplete="off">

</div></header>
<main id="app"></main>
