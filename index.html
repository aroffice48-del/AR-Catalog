<!doctype html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>প্রোডাক্ট রেট তালিকা</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#edf0f4;--sf:#fff;--ink:#0f1b2d;--mute:#5a6a7e;--line:#d8dee7;--am:#e39b0b;--amb:#fff1d0;--ami:#7a4a00;--wa:#178f4a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c121c;--sf:#151e2b;--ink:#eaf0f7;--mute:#9aa9bc;--line:#26334a;--am:#f2b134;--amb:#3a2a08;--ami:#ffd98a;--wa:#3dd27a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c121c;--sf:#151e2b;--ink:#eaf0f7;--mute:#9aa9bc;--line:#26334a;--am:#f2b134;--amb:#3a2a08;--ami:#ffd98a;--wa:#3dd27a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Hind Siliguri","Noto Sans Bengali","Nirmala UI",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--sf);border-bottom:1px solid var(--line);padding:12px 14px 10px}
.wrap{max-width:760px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{margin:0;font-size:20px;font-weight:700;line-height:1.3}
.sub{margin:0 0 8px;color:var(--mute);font-size:13px}
input[type=search]{width:100%;font:inherit;padding:10px 14px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=search]:focus{outline:none;border-color:var(--am)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chip{flex:none;font:inherit;font-size:14px;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--sf);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--am);border-color:var(--am);color:#1b1200;font-weight:600}
main{max-width:760px;margin:0 auto;padding:14px}
main.pad{padding-bottom:110px}
.lead{margin:2px 0 12px;color:var(--mute);font-size:14px}
